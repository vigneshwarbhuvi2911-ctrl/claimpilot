name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit, agent and API tests (real LangGraph, offline agents)
        run: python -m pytest
      - name: Evaluation gate (23 hand-checked claims must all pass)
        run: python -m eval.run --min-accuracy 1.0
        env:
          LLM_PROVIDER: mock
      - name: Docker image builds
        run: docker build -t claimpilot .
