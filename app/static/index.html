<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaimPilot</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --muted:#5f6b7a; --line:#e2e6eb; --accent:#1f4e79;
          --ok:#1b7f4b; --warn:#a15c00; --bad:#b42318; --info:#3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11151a; --card:#1a2028; --ink:#e7ebf0; --muted:#97a3b2;
          --line:#2a323d; --accent:#7fb2e5; --ok:#4cc38a; --warn:#f0b44c; --bad:#ff7b72; --info:#8da2fb; } }
  * { box-sizing:border-box } body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
          background:var(--bg); color:var(--ink) }
  header { padding:18px 16px; border-bottom:1px solid var(--line); background:var(--card) }
  header h1 { margin:0; font-size:20px } header p { margin:4px 0 0; color:var(--muted); font-size:13px }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:300px 1fr }
  @media (max-width:820px) { main { grid-template-columns:1fr } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px }
  .list button { display:block; width:100%; text-align:left; border:0; background:none; color:inherit; padding:8px;
          border-radius:8px; cursor:pointer; font:inherit } .list button:hover, .list button.on { background:var(--bg) }
  .list small { display:block; color:var(--muted) }
  .badge { display:inline-block; font-weight:700; padding:3px 10px; border-radius:999px; color:#fff; font-size:13px }
  .APPROVE{background:var(--ok)} .PARTIAL{background:var(--info)} .REJECT{background:var(--bad)}
  .REFER{background:var(--warn)} .REQUEST_DOCUMENTS{background:var(--muted)}
  h2 { font-size:16px; margin:0 0 8px } h3 { font-size:14px; margin:16px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em }
  table { width:100%; border-collapse:collapse; font-size:14px } td,th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left }
  td.n { text-align:right; font-variant-numeric:tabular-nums } ul { margin:4px 0; padding-left:20px }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center } .muted { color:var(--muted) }
  .trace { display:flex; flex-wrap:wrap; gap:6px } .trace span { border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:12px }
  button.act { border:0; border-radius:8px; padding:8px 14px; font:inherit; color:#fff; cursor:pointer }
  pre { white-space:pre-wrap; background:var(--bg); padding:8px; border-radius:8px; font-size:12px; max-height:220px; overflow:auto }
</style>
</head>
<body>
<header><h1>ClaimPilot</h1>
<p>Agentic claims assistant. Synthetic demo data. The AI recommends; the handler decides.</p></header>
<main>
  <section class="card"><h2>Sample claims</h2><div class="list" id="list"></div></section>
  <section class="card" id="out"><p class="muted">Pick a claim to run it through the agent workflow.</p></section>
</main>
<script>
const $ = (t, attrs = {}, ...kids) => { const e = document.createElement(t);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : e.setAttribute(k, v);
  for (const k of kids) e.append(k instanceof Node ? k : document.createTextNode(k ?? "")); return e; };
const rs = v => v == null ? "–" : "Rs " + Number(v).toLocaleString("en-IN");
const out = document.getElementById("out");

async function loadList() {
  const items = await (await fetch("/samples")).json();
  const list = document.getElementById("list");
  for (const s of items) {
    const b = $("button", {}, s.claim_ref, $("small", {}, s.note || ""));
    b.onclick = () => { [...list.children].forEach(x => x.classList.remove("on")); b.classList.add("on"); run(s.claim_ref); };
    list.append(b);
  }
}

async function run(ref) {
  out.replaceChildren($("p", {class: "muted"}, "Running agents…"));
  const claim = await (await fetch("/samples/" + ref)).json();
  const r = await (await fetch("/claims", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify(claim)})).json();
  render(r, claim);
}

function render(r, claim) {
  const n = r.note_for_handler;
  const head = $("div", {class: "row"}, $("span", {class: "badge " + r.recommendation}, r.recommendation.replace("_", " ")),
    $("strong", {}, `${r.claim_ref} · ${r.policy_no || "?"}`),
    $("span", {class: "muted"}, `Claimed ${rs(r.claimed)} · Payable ${rs(r.payable)}`),
    r.requires_senior_review ? $("span", {class: "badge REFER"}, "Senior handler") : "");
  const reasons = $("ul"); (n.reasons || []).forEach(x => reasons.append($("li", {}, x)));
  const steps = $("ul"); (n.next_steps || []).forEach(x => steps.append($("li", {}, x)));
  const tbl = $("table", {}, $("tr", {}, $("th", {}, "Item"), $("th", {}, "Claimed"), $("th", {}, "Payable"), $("th", {}, "Clause")));
  (r.breakdown || []).forEach(b => tbl.append($("tr", {}, $("td", {}, b.item), $("td", {class: "n"}, b.claimed != null ? rs(b.claimed) : ""),
    $("td", {class: "n"}, rs(b.amount)), $("td", {}, b.clause || ""))));
  const flags = $("ul"); (r.flags || []).forEach(f => flags.append($("li", {}, `${f.flag}: “${f.evidence}”`)));
  const trace = $("div", {class: "trace"}); r.trace.forEach(t => trace.append($("span", {}, `${t.node} ${t.ms}ms${t.source ? " · " + t.source : ""}`)));
  const docs = $("div"); claim.documents.forEach(d => docs.append($("h3", {}, d.doc_type.replace("_", " ")), $("pre", {}, d.text)));
  const actions = $("div", {class: "row"});
  if (r.recommendation !== "REQUEST_DOCUMENTS") {
    for (const [label, dec, color] of [["Approve as recommended", r.recommendation === "PARTIAL" ? "PARTIAL" : "APPROVE", "var(--ok)"],
                                       ["Reject", "REJECT", "var(--bad)"]]) {
      if (dec !== "REJECT" && !r.payable) continue;
      const b = $("button", {class: "act", style: `background:${color}`}, label);
      b.onclick = async () => {
        const res = await fetch(`/claims/${r.run_id}/decision`, {method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({decision: dec, approved_amount: dec === "REJECT" ? null : r.payable, note: "Decided in demo UI"})});
        actions.replaceChildren($("strong", {}, res.ok ? `Handler decision recorded: ${dec}` : "Already decided"));
      };
      actions.append(b);
    }
  }
  out.replaceChildren(head, $("p", {}, n.summary), $("h3", {}, "Reasons"), reasons, $("h3", {}, "Next steps"), steps,
    tbl.children.length > 1 ? $("h3", {}, "Calculation") : "", tbl.children.length > 1 ? tbl : "",
    (r.flags || []).length ? $("h3", {}, "Evidence found by the screener") : "", (r.flags || []).length ? flags : "",
    $("h3", {}, "Agent trace"), trace,
    $("p", {class: "muted"}, `LLM calls ${r.usage.calls} · tokens ${r.usage.input_tokens + r.usage.output_tokens} · cost $${r.usage.cost_usd} · ${r.latency_ms} ms`),
    $("h3", {}, "Handler decision"), actions, $("h3", {}, "Documents"), docs);
}
loadList();
</script>
</body>
</html>
